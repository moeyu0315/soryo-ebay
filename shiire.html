<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2458d6">
<title>仕入れ判断 一括検索ツール</title>
</head>
<body>

<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --ink: #1b2436;
    --sub: #5c6b84;
    --accent: #2458d6;
    --accent-ink: #ffffff;
    --border: #dfe5ee;
    --input-bg: #ffffff;
    --shadow: 0 1px 3px rgba(20, 34, 62, .07);
    --ebay-red: #d93a3f;
    --ebay-blue: #0064d2;
    --mercari: #e64d8c;
    --yahoo: #e60023;
    --closed: #b45309;
    --rakuma: #bf0000;
    --hardoff: #005bac;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141d;
      --card: #18202e;
      --ink: #e8ecf4;
      --sub: #92a0b5;
      --accent: #6a96ff;
      --accent-ink: #0d1526;
      --border: #2a3547;
      --input-bg: #121a26;
      --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141d;
    --card: #18202e;
    --ink: #e8ecf4;
    --sub: #92a0b5;
    --accent: #6a96ff;
    --accent-ink: #0d1526;
    --border: #2a3547;
    --input-bg: #121a26;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px 14px 32px;
    -webkit-text-size-adjust: 100%;
  }
  .container { max-width: 560px; margin: 0 auto; }

  h1 { font-size: 19px; letter-spacing: .01em; }
  .subtitle { color: var(--sub); font-size: 12.5px; margin: 4px 0 14px; line-height: 1.6; }

  .search-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .search-row { display: flex; flex-direction: column; gap: 10px; }
  #keyword {
    width: 100%;
    font-size: 16px; /* 16px未満だとiOSで自動ズームされる */
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--input-bg);
    color: var(--ink);
    transition: border-color .15s;
  }
  #keyword:focus { border-color: var(--accent); }
  #openAll {
    width: 100%;
    font-size: 16px;
    font-weight: 700;
    min-height: 50px;
    padding: 13px 20px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #openAll:active { transform: translateY(1px); opacity: .9; }
  #openAll.queue-mode { background: var(--closed); color: #fff; }

  .options-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .options-row label {
    flex: 1;
    font-size: 11px;
    color: var(--sub);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .options-row select {
    font-size: 14px;
    min-height: 42px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--ink);
    width: 100%;
  }
  .hint { font-size: 11.5px; color: var(--sub); margin-top: 10px; line-height: 1.7; }
  .hint b { color: var(--ink); }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    margin: 16px 2px 8px;
    letter-spacing: .08em;
  }
  .site-list { display: flex; flex-direction: column; gap: 8px; }
  .site-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .site-row input[type="checkbox"] {
    width: 22px; height: 22px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .site-info { flex: 1; min-width: 0; }
  .site-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .site-desc { font-size: 11.5px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    color: #fff;
    flex-shrink: 0;
  }
  a.open-btn {
    font-size: 14px;
    font-weight: 700;
    min-height: 44px;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    text-decoration: none;
    flex-shrink: 0;
    padding: 0 12px;
  }
  a.open-btn:active { background: var(--accent); color: var(--accent-ink); }

  footer { margin-top: 22px; font-size: 11px; color: var(--sub); text-align: center; line-height: 1.9; }

  /* タブレット・PCでは検索窓とボタンを横並びに */
  @media (min-width: 560px) {
    .search-row { flex-direction: row; }
    #openAll { width: auto; white-space: nowrap; }
    a.open-btn:hover { background: var(--accent); color: var(--accent-ink); }
  }
</style>

<div class="container">
  <h1>🔍 仕入れ判断 一括検索ツール</h1>
  <p class="subtitle">型番を入力 → eBay・国内フリマの相場をまとめて検索</p>

  <div class="search-card">
    <div class="search-row">
      <input type="text" id="keyword" placeholder="例:YAMAHA FL-10M" list="history" autocomplete="off" enterkeyhint="search">
      <datalist id="history"></datalist>
      <button id="openAll">✅ 一括で開く</button>
    </div>
    <div class="options-row">
      <label>Terapeak期間
        <select id="tpDays">
          <option value="90">過去90日</option>
          <option value="180" selected>過去180日</option>
          <option value="365">過去365日</option>
          <option value="730">過去2年</option>
        </select>
      </label>
      <label>Terapeakソート
        <select id="tpSort">
          <option value="avgsalesprice" selected>販売価格 安い順</option>
          <option value="-avgsalesprice">販売価格 高い順</option>
          <option value="-totalsoldcount">売れた数 多い順</option>
          <option value="-lastsolddate">最近売れた順</option>
          <option value="-totalsalesamount">売上合計 多い順</option>
        </select>
      </label>
    </div>
  </div>

  <div class="section-label">海外相場(eBay)</div>
  <div class="site-list" id="siteListEbay"></div>

  <div class="section-label">国内相場・仕入れ先</div>
  <div class="site-list" id="siteListJp"></div>

  <footer>
    チェックを外したサイトは一括オープンの対象外(設定は自動保存)。<br>
    Terapeakの表示にはeBayセラーアカウントでのログインが必要です。<br>
    日付は開いた時点から自動計算されるので、URLが古くなる心配はありません。<br>
    共有メニューから<b>「ホーム画面に追加」</b>するとアプリのように使えます。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var DAY_MS = 24 * 60 * 60 * 1000;

  // URLを直接タップで開くとiOSのユニバーサルリンクでアプリ(eBay/メルカリ等)に飛ばされるため、
  // 先に空白タブを開いてからJSでURLを読み込む(この方式ならブラウザ内で開く)
  function openInBrowser(url) {
    var w = window.open("", "_blank");
    if (w) {
      try { w.opener = null; } catch (e) {}
      w.location.href = url;
    }
    return w; // ポップアップブロック時はnull
  }

  // 各サイトの定義。url(kw) がキーワードから検索URLを生成する
  var SITES = [
    {
      id: "ebay_active",
      group: "ebay",
      name: "eBay 出品中",
      badge: { text: "eBay", color: "var(--ebay-blue)" },
      desc: "現在出品中・送料込み最安値順(米国)",
      url: function (kw) {
        return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(kw) + "&_sacat=0&_sop=15";
      }
    },
    {
      id: "ebay_terapeak",
      group: "ebay",
      name: "eBay Research(Terapeak)",
      badge: { text: "SOLD", color: "var(--ebay-red)" },
      desc: "販売履歴 ※要セラーログイン/期間・ソートは上の設定に従う",
      url: function (kw) {
        var days = parseInt(document.getElementById("tpDays").value, 10);
        var sort = document.getElementById("tpSort").value;
        var end = Date.now();
        var start = end - days * DAY_MS;
        return "https://www.ebay.com/sh/research?marketplace=EBAY-US" +
          "&keywords=" + encodeURIComponent(kw) +
          "&dayRange=" + days +
          "&endDate=" + end +
          "&startDate=" + start +
          "&categoryId=0&offset=0&limit=50" +
          "&sorting=" + encodeURIComponent(sort) +
          "&tabName=SOLD&tz=" + encodeURIComponent("Asia/Tokyo");
      }
    },
    {
      id: "mercari",
      group: "jp",
      name: "メルカリ",
      badge: { text: "販売中", color: "var(--mercari)" },
      desc: "販売中・価格の安い順",
      url: function (kw) {
        return "https://jp.mercari.com/search?keyword=" + encodeURIComponent(kw) + "&status=on_sale&sort=price&order=asc";
      }
    },
    {
      id: "yahoo_auction_active",
      group: "jp",
      name: "ヤフオク 出品中",
      badge: { text: "出品中", color: "var(--yahoo)" },
      desc: "現在価格の安い順",
      url: function (kw) {
        var q = encodeURIComponent(kw);
        return "https://auctions.yahoo.co.jp/search/search?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a";
      }
    },
    {
      id: "yahoo_auction_closed",
      group: "jp",
      name: "ヤフオク 落札相場",
      badge: { text: "落札済", color: "var(--closed)" },
      desc: "過去の落札価格・安い順",
      url: function (kw) {
        var q = encodeURIComponent(kw);
        return "https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a";
      }
    },
    {
      id: "yahoo_flea",
      group: "jp",
      name: "Yahoo!フリマ",
      badge: { text: "販売中", color: "var(--yahoo)" },
      desc: "旧PayPayフリマ・販売中・価格の安い順",
      url: function (kw) {
        return "https://paypayfleamarket.yahoo.co.jp/search/" + encodeURIComponent(kw) + "?sort=price&order=asc&itemStatus=open";
      }
    },
    {
      id: "rakuma",
      group: "jp",
      name: "楽天ラクマ",
      badge: { text: "販売中", color: "var(--rakuma)" },
      desc: "販売中・価格の安い順",
      url: function (kw) {
        return "https://fril.jp/search/" + encodeURIComponent(kw) + "?transaction=selling&sort=sell_price&order=asc";
      }
    },
    {
      id: "hardoff",
      group: "jp",
      name: "ハードオフ ネットモール",
      badge: { text: "通販", color: "var(--hardoff)" },
      desc: "ハードオフ公式通販(オフモール)",
      url: function (kw) {
        return "https://netmall.hardoff.co.jp/search/?q=" + encodeURIComponent(kw);
      }
    }
  ];

  var STORAGE_CHECKS = "sourcing_tool_checks";
  var STORAGE_HISTORY = "sourcing_tool_history";
  var STORAGE_TP = "sourcing_tool_terapeak";

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  var checks = loadJSON(STORAGE_CHECKS, {});

  // サイト行を描画
  SITES.forEach(function (site) {
    var row = document.createElement("div");
    row.className = "site-row";

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checks[site.id] !== false; // 既定はON
    cb.title = "一括オープンに含める";
    cb.addEventListener("change", function () {
      checks[site.id] = cb.checked;
      saveJSON(STORAGE_CHECKS, checks);
    });

    var info = document.createElement("div");
    info.className = "site-info";
    var nameEl = document.createElement("div");
    nameEl.className = "site-name";
    nameEl.textContent = site.name;
    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = site.badge.text;
    badge.style.background = site.badge.color;
    nameEl.appendChild(badge);
    var descEl = document.createElement("div");
    descEl.className = "site-desc";
    descEl.textContent = site.desc;
    info.appendChild(nameEl);
    info.appendChild(descEl);

    // iOSでも確実に開けるよう、個別オープンはリンク方式にする
    var link = document.createElement("a");
    link.className = "open-btn";
    link.textContent = "開く ↗";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.href = "#";
    link.addEventListener("click", function (e) {
      e.preventDefault(); // href直接遷移はアプリに飛ぶためJSで開く
      var kw = getKeyword();
      if (!kw) return;
      pushHistory(kw);
      var u = site.url(kw); // クリック時点のキーワード・設定・日付でURLを確定
      if (!openInBrowser(u)) location.href = u; // 万一ブロックされたら同じタブで開く
    });

    row.appendChild(cb);
    row.appendChild(info);
    row.appendChild(link);
    site._checkbox = cb;

    document.getElementById(site.group === "ebay" ? "siteListEbay" : "siteListJp").appendChild(row);
  });

  function getKeyword() {
    var kw = document.getElementById("keyword").value.trim();
    if (!kw) {
      document.getElementById("keyword").focus();
      return null;
    }
    return kw;
  }

  // 検索履歴(直近15件)を datalist に反映
  function renderHistory() {
    var list = document.getElementById("history");
    list.innerHTML = "";
    loadJSON(STORAGE_HISTORY, []).forEach(function (kw) {
      var opt = document.createElement("option");
      opt.value = kw;
      list.appendChild(opt);
    });
  }
  function pushHistory(kw) {
    var hist = loadJSON(STORAGE_HISTORY, []).filter(function (k) { return k !== kw; });
    hist.unshift(kw);
    saveJSON(STORAGE_HISTORY, hist.slice(0, 15));
    renderHistory();
  }
  renderHistory();

  // Terapeak設定の保存・復元
  var tp = loadJSON(STORAGE_TP, {});
  if (tp.days) document.getElementById("tpDays").value = tp.days;
  if (tp.sort) document.getElementById("tpSort").value = tp.sort;
  ["tpDays", "tpSort"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () {
      saveJSON(STORAGE_TP, {
        days: document.getElementById("tpDays").value,
        sort: document.getElementById("tpSort").value
      });
    });
  });

  // スマホのポップアップ制限でブロックされたサイトは、キューに積んで
  // 「▶ 次を開く」ボタンのタップごとに1件ずつ開く(タップ=ユーザー操作なので確実に開ける)
  var queue = [];
  var openAllBtn = document.getElementById("openAll");

  function updateOpenAllBtn() {
    if (queue.length) {
      openAllBtn.textContent = "▶ 次を開く:" + queue[0].name + "(残り" + queue.length + ")";
      openAllBtn.classList.add("queue-mode");
    } else {
      openAllBtn.textContent = "✅ 一括で開く";
      openAllBtn.classList.remove("queue-mode");
    }
  }

  function resetQueue() {
    if (queue.length) { queue = []; updateOpenAllBtn(); }
  }

  function openAll() {
    if (queue.length) { // キュー消化モード:1タップ1サイト
      var item = queue.shift();
      openInBrowser(item.url);
      updateOpenAllBtn();
      return;
    }
    var kw = getKeyword();
    if (!kw) return;
    pushHistory(kw);
    var targets = SITES.filter(function (s) { return s._checkbox.checked; });
    targets.forEach(function (site) {
      var u = site.url(kw);
      if (!openInBrowser(u)) queue.push({ name: site.name, url: u }); // ブロックされた分をキューへ
    });
    updateOpenAllBtn();
  }

  openAllBtn.addEventListener("click", openAll);
  document.getElementById("keyword").addEventListener("input", resetQueue);
  SITES.forEach(function (s) { s._checkbox.addEventListener("change", resetQueue); });
  document.getElementById("keyword").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.target.blur(); openAll(); }
  });
})();
</script>

</body>
</html>
