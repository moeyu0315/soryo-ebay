<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d4d3e">
<title>仕入れ判断 一括検索</title>
</head>
<body>

<style>
  :root{
    --bg:#ece4d0; --card:#fbf7ee; --line:#e3dcc8;
    --txt:#26302a; --sub:#6f6b59; --accent:#1a7a5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;line-height:1.5;min-height:100vh
  }
  header{background:linear-gradient(180deg,#1d4d3e,#163d31);color:#fff;padding:12px 16px}
  header .hd{max-width:560px;margin:0 auto}
  header h1{font-size:17px;font-weight:700}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px}

  .kw-wrap{position:relative;margin-bottom:14px}
  #keyword{
    width:100%;
    font-size:17px;
    font-weight:600;
    padding:16px 52px 16px 15px;
    border:2px solid var(--line);
    border-radius:14px;
    outline:none;
    background:#fff;
    color:var(--txt);
  }
  #keyword:focus{border-color:var(--accent)}
  #clearKw{
    position:absolute;right:7px;top:50%;transform:translateY(-50%);
    width:42px;height:42px;border:none;border-radius:50%;
    background:transparent;color:var(--sub);font-size:18px;cursor:pointer
  }
  #clearKw:active{background:var(--line)}

  .section{font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 2px 8px;letter-spacing:.05em}
  .site-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  a.site-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    min-height:74px;
    background:#fff;
    border:1px solid var(--line);
    border-left:6px solid var(--c,var(--accent));
    border-radius:14px;
    box-shadow:0 1px 3px rgba(60,50,20,.08);
    padding:10px 8px;
    text-decoration:none;
    color:var(--txt);
    text-align:center;
  }
  a.site-btn:active{background:var(--line)}
  .icon{font-size:24px;line-height:1}
  .site-name{font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.3}
</style>

<header><div class="hd"><h1>🔍 仕入れ判断 一括検索</h1></div></header>
<div class="wrap">

  <div class="kw-wrap">
    <input type="text" id="keyword" placeholder="型番を入力" list="history" autocomplete="off" enterkeyhint="done">
    <button id="clearKw" type="button" aria-label="入力を消す">✕</button>
    <datalist id="history"></datalist>
  </div>

  <div class="section">海外相場(eBay)</div>
  <div class="site-grid" id="listEbay"></div>

  <div class="section">国内相場・仕入れ先</div>
  <div class="site-grid" id="listJp"></div>

</div>

<script>
(function () {
  "use strict";

  var DAY_MS = 24 * 60 * 60 * 1000;

  var SITES = [
    {
      id: "ebay", group: "ebay", name: "eBay 出品中", icon: "🌎", color: "#0064d2",
      url: function (kw) { return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(kw) + "&_sacat=0&_sop=15"; }
    },
    {
      id: "terapeak", group: "ebay", name: "Terapeak", icon: "📊", color: "#e53238",
      url: function (kw) {
        var end = Date.now(), start = end - 180 * DAY_MS;
        return "https://www.ebay.com/sh/research?marketplace=EBAY-US&keywords=" + encodeURIComponent(kw) +
          "&dayRange=180&endDate=" + end + "&startDate=" + start +
          "&categoryId=0&offset=0&limit=50&sorting=avgsalesprice&tabName=SOLD&tz=" + encodeURIComponent("Asia/Tokyo");
      }
    },
    {
      id: "mercari", group: "jp", name: "メルカリ", icon: "🛍️", color: "#e64d8c",
      url: function (kw) { return "https://jp.mercari.com/search?keyword=" + encodeURIComponent(kw) + "&status=on_sale&sort=price&order=asc"; }
    },
    {
      id: "yahoo_active", group: "jp", name: "ヤフオク 出品中", icon: "🔨", color: "#dc2626",
      url: function (kw) { var q = encodeURIComponent(kw); return "https://auctions.yahoo.co.jp/search/search?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a"; }
    },
    {
      id: "yahoo_closed", group: "jp", name: "ヤフオク 落札相場", icon: "🏷️", color: "#b45309",
      url: function (kw) { var q = encodeURIComponent(kw); return "https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a"; }
    },
    {
      id: "paypay", group: "jp", name: "Yahoo!フリマ", icon: "🛒", color: "#ff0033",
      url: function (kw) { return "https://paypayfleamarket.yahoo.co.jp/search/" + encodeURIComponent(kw) + "?sort=price&order=asc&itemStatus=open"; }
    },
    {
      id: "fril", group: "jp", name: "楽天ラクマ", icon: "🎀", color: "#bf0000",
      url: function (kw) { return "https://fril.jp/search/" + encodeURIComponent(kw) + "?transaction=selling&sort=sell_price&order=asc"; }
    },
    {
      id: "hardoff", group: "jp", name: "ハードオフ", icon: "♻️", color: "#005bac",
      url: function (kw) { return "https://netmall.hardoff.co.jp/search/?q=" + encodeURIComponent(kw); }
    }
  ];

  var STORAGE_HISTORY = "sourcing_tool_history";
  var STORAGE_LAST = "sourcing_tool_last_kw";
  function loadJSON(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  var kwInput = document.getElementById("keyword");

  // iPhoneのChromeは「戻る」でページを再読み込みして入力欄が空になるため、
  // URLハッシュ + localStorage の両方に型番を保存し、表示のたびに復元する
  function hashKw() {
    try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; }
  }
  function saveKw() {
    saveJSON(STORAGE_LAST, kwInput.value);
    try { history.replaceState(null, "", kwInput.value ? "#" + encodeURIComponent(kwInput.value) : location.pathname); } catch (e) {}
  }
  function restoreKw() {
    if (!kwInput.value) kwInput.value = hashKw() || loadJSON(STORAGE_LAST, "");
  }
  restoreKw();
  window.addEventListener("pageshow", restoreKw); // 「戻る」で帰ってきたときも復元
  window.addEventListener("pagehide", saveKw);

  kwInput.addEventListener("input", saveKw);
  kwInput.addEventListener("change", saveKw);
  kwInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") e.target.blur();
  });
  document.getElementById("clearKw").addEventListener("click", function () {
    kwInput.value = "";
    saveKw();
    kwInput.focus();
  });

  function renderHistory() {
    var list = document.getElementById("history");
    list.innerHTML = "";
    loadJSON(STORAGE_HISTORY, []).forEach(function (kw) {
      var opt = document.createElement("option");
      opt.value = kw;
      list.appendChild(opt);
    });
  }
  function pushHistory(kw) {
    var hist = loadJSON(STORAGE_HISTORY, []).filter(function (k) { return k !== kw; });
    hist.unshift(kw);
    saveJSON(STORAGE_HISTORY, hist.slice(0, 15));
    renderHistory();
  }
  renderHistory();

  SITES.forEach(function (site) {
    var a = document.createElement("a");
    a.className = "site-btn";
    a.href = "#";
    a.style.setProperty("--c", site.color);
    a.innerHTML = '<span class="icon"></span><span class="site-name"></span>';
    a.querySelector(".icon").textContent = site.icon;
    a.querySelector(".site-name").textContent = site.name;
    a.addEventListener("click", function (e) {
      var kw = kwInput.value.trim();
      if (!kw) { e.preventDefault(); kwInput.focus(); return; }
      saveKw(); // 開く直前に必ず保存(戻ったとき確実に復元するため)
      pushHistory(kw);
      a.href = site.url(kw); // タップ時点の型番・日付でURL確定。直接開く(アプリがあればアプリ)
    });
    document.getElementById(site.group === "ebay" ? "listEbay" : "listJp").appendChild(a);
  });
})();
</script>

</body>
</html>
