<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2458d6">
<title>仕入れ判断 一括検索ツール</title>
</head>
<body>

<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --ink: #1b2436;
    --sub: #5c6b84;
    --accent: #2458d6;
    --accent-ink: #ffffff;
    --border: #dfe5ee;
    --input-bg: #ffffff;
    --shadow: 0 1px 3px rgba(20, 34, 62, .07);
    --ebay-red: #d93a3f;
    --ebay-blue: #0064d2;
    --mercari: #e64d8c;
    --yahoo: #e60023;
    --closed: #b45309;
    --rakuma: #bf0000;
    --hardoff: #005bac;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141d;
      --card: #18202e;
      --ink: #e8ecf4;
      --sub: #92a0b5;
      --accent: #6a96ff;
      --accent-ink: #0d1526;
      --border: #2a3547;
      --input-bg: #121a26;
      --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141d;
    --card: #18202e;
    --ink: #e8ecf4;
    --sub: #92a0b5;
    --accent: #6a96ff;
    --accent-ink: #0d1526;
    --border: #2a3547;
    --input-bg: #121a26;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px 14px 32px;
    -webkit-text-size-adjust: 100%;
  }
  .container { max-width: 560px; margin: 0 auto; }

  h1 { font-size: 19px; letter-spacing: .01em; }
  .subtitle { color: var(--sub); font-size: 12.5px; margin: 4px 0 14px; line-height: 1.6; }

  .search-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .search-row { display: flex; flex-direction: column; gap: 10px; }
  .kw-wrap { position: relative; }
  #clearKw {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--sub);
    font-size: 16px;
    cursor: pointer;
  }
  #clearKw:active { background: var(--border); }
  #keyword {
    width: 100%;
    font-size: 16px; /* 16px未満だとiOSで自動ズームされる */
    padding: 14px 46px 14px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--input-bg);
    color: var(--ink);
    transition: border-color .15s;
  }
  #keyword:focus { border-color: var(--accent); }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    margin: 16px 2px 8px;
    letter-spacing: .08em;
  }
  .site-list { display: flex; flex-direction: column; gap: 8px; }
  .site-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .site-info { flex: 1; min-width: 0; }
  .site-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .site-desc { font-size: 11.5px; color: var(--sub); margin-top: 2px; line-height: 1.5; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    color: #fff;
    flex-shrink: 0;
  }
  a.open-btn {
    font-size: 14px;
    font-weight: 700;
    min-height: 44px;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    text-decoration: none;
    flex-shrink: 0;
    padding: 0 12px;
  }
  a.open-btn:active { background: var(--accent); color: var(--accent-ink); }

  footer { margin-top: 22px; font-size: 11px; color: var(--sub); text-align: center; line-height: 1.9; }

  @media (min-width: 560px) {
    a.open-btn:hover { background: var(--accent); color: var(--accent-ink); }
  }
</style>

<div class="container">
  <h1>🔍 仕入れ判断 一括検索ツール</h1>
  <p class="subtitle">型番を入力 → eBay・国内フリマの相場をまとめて検索</p>

  <div class="search-card">
    <div class="search-row">
      <div class="kw-wrap">
        <input type="text" id="keyword" placeholder="例:YAMAHA FL-10M" list="history" autocomplete="off" enterkeyhint="done">
        <button id="clearKw" type="button" aria-label="入力を消す">✕</button>
      </div>
      <datalist id="history"></datalist>
    </div>
  </div>

  <div class="section-label">海外相場(eBay)</div>
  <div class="site-list" id="siteListEbay"></div>

  <div class="section-label">国内相場・仕入れ先</div>
  <div class="site-list" id="siteListJp"></div>

  <footer>
    Terapeakの表示にはeBayセラーアカウントでのログインが必要です。<br>
    日付は開いた時点から自動計算されるので、URLが古くなる心配はありません。<br>
    共有メニューから<b>「ホーム画面に追加」</b>するとアプリのように使えます。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var DAY_MS = 24 * 60 * 60 * 1000;

  // URLを直接タップで開くとiOSのユニバーサルリンクでアプリ(eBay/メルカリ等)に飛ばされるため、
  // 同サイト内の中継ページ(go.html)を経由してJSで転送する(この方式ならブラウザ内で開く)。
  // 中継ページは履歴に残らないので、検索ページから「戻る」を押すとこのツールに直接帰ってくる。
  var GO_URL = "https://moeyu0315.github.io/soryo-ebay/go.html";
  function goUrl(url) {
    return GO_URL + "#" + encodeURIComponent(url);
  }

  // 各サイトの定義。url(kw) がキーワードから検索URLを生成する
  var SITES = [
    {
      id: "ebay_active",
      group: "ebay",
      name: "eBay 出品中",
      badge: { text: "eBay", color: "var(--ebay-blue)" },
      desc: "現在出品中・送料込み最安値順(米国)",
      url: function (kw) {
        return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(kw) + "&_sacat=0&_sop=15";
      }
    },
    {
      id: "ebay_terapeak",
      group: "ebay",
      name: "eBay Research(Terapeak)",
      badge: { text: "SOLD", color: "var(--ebay-red)" },
      desc: "販売履歴 過去180日・安い順 ※要セラーログイン",
      url: function (kw) {
        var days = 180;
        var sort = "avgsalesprice"; // 平均販売価格の安い順
        var end = Date.now();
        var start = end - days * DAY_MS;
        return "https://www.ebay.com/sh/research?marketplace=EBAY-US" +
          "&keywords=" + encodeURIComponent(kw) +
          "&dayRange=" + days +
          "&endDate=" + end +
          "&startDate=" + start +
          "&categoryId=0&offset=0&limit=50" +
          "&sorting=" + encodeURIComponent(sort) +
          "&tabName=SOLD&tz=" + encodeURIComponent("Asia/Tokyo");
      }
    },
    {
      id: "mercari",
      group: "jp",
      name: "メルカリ",
      badge: { text: "販売中", color: "var(--mercari)" },
      desc: "販売中・価格の安い順",
      url: function (kw) {
        return "https://jp.mercari.com/search?keyword=" + encodeURIComponent(kw) + "&status=on_sale&sort=price&order=asc";
      }
    },
    {
      id: "yahoo_auction_active",
      group: "jp",
      name: "ヤフオク 出品中",
      badge: { text: "出品中", color: "var(--yahoo)" },
      desc: "現在価格の安い順",
      url: function (kw) {
        var q = encodeURIComponent(kw);
        return "https://auctions.yahoo.co.jp/search/search?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a";
      }
    },
    {
      id: "yahoo_auction_closed",
      group: "jp",
      name: "ヤフオク 落札相場",
      badge: { text: "落札済", color: "var(--closed)" },
      desc: "過去の落札価格・安い順",
      url: function (kw) {
        var q = encodeURIComponent(kw);
        return "https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=" + q + "&va=" + q + "&b=1&n=50&s1=cbids&o1=a";
      }
    },
    {
      id: "yahoo_flea",
      group: "jp",
      name: "Yahoo!フリマ",
      badge: { text: "販売中", color: "var(--yahoo)" },
      desc: "旧PayPayフリマ・販売中・価格の安い順",
      url: function (kw) {
        return "https://paypayfleamarket.yahoo.co.jp/search/" + encodeURIComponent(kw) + "?sort=price&order=asc&itemStatus=open";
      }
    },
    {
      id: "rakuma",
      group: "jp",
      name: "楽天ラクマ",
      badge: { text: "販売中", color: "var(--rakuma)" },
      desc: "販売中・価格の安い順",
      url: function (kw) {
        return "https://fril.jp/search/" + encodeURIComponent(kw) + "?transaction=selling&sort=sell_price&order=asc";
      }
    },
    {
      id: "hardoff",
      group: "jp",
      name: "ハードオフ ネットモール",
      badge: { text: "通販", color: "var(--hardoff)" },
      desc: "ハードオフ公式通販(オフモール)",
      url: function (kw) {
        return "https://netmall.hardoff.co.jp/search/?q=" + encodeURIComponent(kw);
      }
    }
  ];

  var STORAGE_HISTORY = "sourcing_tool_history";

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // サイト行を描画
  SITES.forEach(function (site) {
    var row = document.createElement("div");
    row.className = "site-row";

    var info = document.createElement("div");
    info.className = "site-info";
    var nameEl = document.createElement("div");
    nameEl.className = "site-name";
    nameEl.textContent = site.name;
    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = site.badge.text;
    badge.style.background = site.badge.color;
    nameEl.appendChild(badge);
    var descEl = document.createElement("div");
    descEl.className = "site-desc";
    descEl.textContent = site.desc;
    info.appendChild(nameEl);
    info.appendChild(descEl);

    // 同じタブで開き、「戻る」でこの画面に帰ってくるハブ方式
    var link = document.createElement("a");
    link.className = "open-btn";
    link.textContent = "開く";
    link.href = "#";
    link.addEventListener("click", function (e) {
      var kw = getKeyword();
      if (!kw) { e.preventDefault(); return; }
      pushHistory(kw);
      // クリック時点のキーワード・日付でURLを確定し、通常のリンク遷移で同じタブで開く
      link.href = goUrl(site.url(kw));
    });

    row.appendChild(info);
    row.appendChild(link);

    document.getElementById(site.group === "ebay" ? "siteListEbay" : "siteListJp").appendChild(row);
  });

  function getKeyword() {
    var kw = document.getElementById("keyword").value.trim();
    if (!kw) {
      document.getElementById("keyword").focus();
      return null;
    }
    return kw;
  }

  // 検索履歴(直近15件)を datalist に反映
  function renderHistory() {
    var list = document.getElementById("history");
    list.innerHTML = "";
    loadJSON(STORAGE_HISTORY, []).forEach(function (kw) {
      var opt = document.createElement("option");
      opt.value = kw;
      list.appendChild(opt);
    });
  }
  function pushHistory(kw) {
    var hist = loadJSON(STORAGE_HISTORY, []).filter(function (k) { return k !== kw; });
    hist.unshift(kw);
    saveJSON(STORAGE_HISTORY, hist.slice(0, 15));
    renderHistory();
  }
  renderHistory();

  // 検索ページから戻ってきても型番が消えないよう、入力内容を自動保存・復元する
  var STORAGE_LAST = "sourcing_tool_last_kw";
  var kwInput = document.getElementById("keyword");
  if (!kwInput.value) kwInput.value = loadJSON(STORAGE_LAST, "");
  kwInput.addEventListener("input", function () {
    saveJSON(STORAGE_LAST, kwInput.value);
  });

  document.getElementById("clearKw").addEventListener("click", function () {
    kwInput.value = "";
    saveJSON(STORAGE_LAST, "");
    kwInput.focus();
  });

  // Enterでキーボードを閉じる
  kwInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") e.target.blur();
  });
})();
</script>

</body>
</html>
