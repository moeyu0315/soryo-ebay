<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開いています…</title>
<style>
  body { font-family: sans-serif; background: #ece4d0; color: #6f6b59; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-size: 15px; }
</style>
</head>
<body>
<p id="msg">開いています…</p>
<script>
// 仕入れ判断ツール用の中継ページ。
// メルカリ・Yahoo!フリマ・ラクマは検索URLがユニバーサルリンク(アプリ横取り)の対象のため、
// 一旦このページを経由し、JSで転送する。JSによる遷移はユーザーのタップ扱いにならず
// ユニバーサルリンクを発動しないため、必ずブラウザで開く。
// 転送は1回だけ(再転送タイマーは二重オープンの原因になるため置かない)。
(function () {
  var ALLOWED = [
    "www.ebay.com",
    "jp.mercari.com",
    "auctions.yahoo.co.jp",
    "page.auctions.yahoo.co.jp",
    "paypayfleamarket.yahoo.co.jp",
    "fril.jp",
    "item.fril.jp",
    "netmall.hardoff.co.jp"
  ];

  function targetUrl() {
    try {
      var u = new URL(decodeURIComponent(location.hash.slice(1)));
      if (u.protocol === "https:" && ALLOWED.indexOf(u.hostname) !== -1) return u.href;
    } catch (e) {}
    return null;
  }

  function go() {
    var t = targetUrl();
    if (t) {
      location.replace(t);
    } else {
      document.getElementById("msg").textContent = "無効なURLです。検索ツールから開き直してください。";
    }
  }
  window.addEventListener("pageshow", go);   // 通常表示・bfcache復帰
  window.addEventListener("hashchange", go); // このページ滞在中に別の転送先が指定された場合
})();
</script>
</body>
</html>
