<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開いています…</title>
<style>
  body { font-family: sans-serif; background: #f2f4f8; color: #5c6b84; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-size: 15px; }
  @media (prefers-color-scheme: dark) { body { background: #0f141d; color: #92a0b5; } }
</style>
</head>
<body>
<p id="msg">開いています…</p>
<script>
// 仕入れ判断検索ツール用の中継ページ。
// リンクを直接タップするとiOSのユニバーサルリンクでアプリが起動してしまうため、
// 一旦このページ(同一サイト内)を経由し、JSで転送することでブラウザ内で開けるようにする。
// location.replaceで転送するため、このページは履歴に残らず「戻る」でツールに直接帰れる。
(function () {
  var ALLOWED = [
    "www.ebay.com",
    "jp.mercari.com",
    "auctions.yahoo.co.jp",
    "page.auctions.yahoo.co.jp",
    "paypayfleamarket.yahoo.co.jp",
    "fril.jp",
    "item.fril.jp",
    "netmall.hardoff.co.jp"
  ];

  function targetUrl() {
    try {
      var u = new URL(decodeURIComponent(location.hash.slice(1)));
      if (u.protocol === "https:" && ALLOWED.indexOf(u.hostname) !== -1) return u.href;
    } catch (e) {}
    return null;
  }

  // pageshowはbfcacheからの復帰時にも発火するので、どのケースでも必ず転送される。
  // JSのlocation変更はタップ操作の効力(transient activation)を引き継ぎ、
  // ユニバーサルリンクでアプリが起動してしまう。メタリフレッシュによる転送は
  // ユーザー操作と無関係な転送として処理されるため、アプリが起動しない。
  window.addEventListener("pageshow", function () {
    var t = targetUrl();
    if (!t) {
      document.getElementById("msg").textContent = "無効なURLです。検索ツールから開き直してください。";
      return;
    }
    var m = document.createElement("meta");
    m.httpEquiv = "refresh";
    m.content = "0;url=" + t;
    document.head.appendChild(m);
    // 保険:メタリフレッシュが効かない環境ではタップの効力が切れた頃にJSで転送
    setTimeout(function () { location.replace(t); }, 6000);
  });
})();
</script>
</body>
</html>
